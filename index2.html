<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تقرير متابعة المادة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#f3f6fb;--card:#fff;--ink:#12203a;--mute:#5d6b85;--line:#d9e1ee;
  --blue:#2457d6;--amber:#c76d0a;--bubble:#e3efff;--bubble-ink:#10264d;--field:#f8fafd;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0e1626;--card:#16213a;--ink:#e8eefb;--mute:#93a2c0;--line:#2a3856;
    --blue:#6b95ff;--amber:#f0a04b;--bubble:#1f3a66;--bubble-ink:#e8f1ff;--field:#0f1a2f;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0e1626;--card:#16213a;--ink:#e8eefb;--mute:#93a2c0;--line:#2a3856;
  --blue:#6b95ff;--amber:#f0a04b;--bubble:#1f3a66;--bubble-ink:#e8f1ff;--field:#0f1a2f;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Cairo',system-ui,sans-serif;line-height:1.6}
main{max-width:560px;margin:0 auto;padding:16px 14px 40px}
h1{font-size:1.25rem;margin:8px 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
label{display:block;font-size:.85rem;color:var(--mute);margin-bottom:4px}
input,select{width:100%;font:inherit;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:8px;padding:9px 10px}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sec-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.sec-h h2{margin:0;font-size:1.05rem}
.lec{border-inline-start:4px solid var(--blue)}
.bank{border-inline-start:4px solid var(--amber)}
.row{display:grid;grid-template-columns:1fr 1fr 40px;gap:8px;padding:10px 0;border-top:1px solid var(--line)}
.row .note{grid-column:1 / 3}
.row .del{grid-column:3;grid-row:1 / 3;align-self:stretch}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--field);color:var(--ink);padding:8px 12px}
.add{color:var(--blue);font-weight:600}
.del{color:var(--mute);padding:0}
.bubble{background:var(--bubble);color:var(--bubble-ink);border-radius:14px 14px 14px 4px;padding:12px 14px;white-space:pre-wrap;word-break:break-word;min-height:60px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.primary{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:700;padding:11px}
:root[data-theme="dark"] .primary,:root:not([data-theme="light"]) .primary{color:#0b1530}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .primary{color:#fff}}
#msg{min-height:1.4em;margin:8px 0 0;font-size:.9rem;color:var(--mute)}
</style>
</head>
<body>
<main>
  <h1>تقرير متابعة المادة</h1>

  <div class="card two">
    <div><label for="subj">المادة</label><input id="subj" placeholder="مثال: الفيزياء 2" autocomplete="off"></div>
    <div><label for="lead">مسؤول المادة</label><input id="lead" placeholder="اسمك" autocomplete="off"></div>
  </div>

  <div class="card lec">
    <div class="sec-h"><h2>🔷 المحاضرات</h2><button class="add" data-add="lec">+ إضافة</button></div>
    <div id="lec"></div>
  </div>

  <div class="card bank">
    <div class="sec-h"><h2>🔶 البنوك</h2><button class="add" data-add="bank">+ إضافة</button></div>
    <div id="bank"></div>
  </div>

  <div class="card">
    <label>شكل الرسالة</label>
    <div class="bubble" id="out"></div>
    <div class="actions">
      <button class="primary" id="tg">إرسال عبر تيليجرام</button>
      <button id="copy">نسخ التقرير</button>
    </div>
    <p id="msg"></p>
  </div>
</main>

<script>
const STAGES=[
  ["✍️","كتابة المحاضرة"],
  ["💻","تفريغ إلكتروني"],
  ["🔍","مراجعة العضو العملي"],
  ["📤","مرفوعة للمسؤول التقني"],
  ["✅","منشورة على البوت"],
  ["🔁","رجعت للتعديل"]
];
const rows={lec:[],bank:[]};
const $=id=>document.getElementById(id);

function save(){try{localStorage.setItem("rb_lead",$("lead").value)}catch(e){}}
function load(){try{$("lead").value=localStorage.getItem("rb_lead")||""}catch(e){}}

function el(tag,props,kids){
  const e=document.createElement(tag);
  Object.assign(e,props||{});
  (kids||[]).forEach(k=>e.appendChild(k));
  return e;
}

function render(kind){
  const box=$(kind);box.textContent="";
  rows[kind].forEach((r,i)=>{
    const name=el("input",{placeholder:kind==="lec"?"محاضرة 1":"بنك 1",value:r.name});
    name.oninput=()=>{r.name=name.value;build()};
    const sel=el("select");
    STAGES.forEach((s,idx)=>{sel.appendChild(el("option",{value:idx,textContent:s[0]+" "+s[1],selected:idx===r.stage}))});
    sel.onchange=()=>{r.stage=+sel.value;build()};
    const note=el("input",{className:"note",placeholder:"ملاحظة (اختياري)",value:r.note});
    note.oninput=()=>{r.note=note.value;build()};
    const del=el("button",{className:"del",textContent:"✕",title:"حذف"});
    del.onclick=()=>{rows[kind].splice(i,1);render(kind);build()};
    const row=el("div",{className:"row"},[name,sel,note,del]);
    box.appendChild(row);
  });
}

function addRow(kind){
  rows[kind].push({name:"",stage:0,note:""});
  render(kind);build();
}

function section(title,list){
  const items=list.filter(r=>r.name.trim());
  if(!items.length)return "";
  const lines=items.map(r=>{
    const s=STAGES[r.stage];
    return "• "+r.name.trim()+" ← "+s[0]+" "+s[1]+(r.note.trim()?" ("+r.note.trim()+")":"");
  });
  return title+"\n"+lines.join("\n");
}

function build(){
  const d=new Date().toLocaleDateString("en-GB");
  const parts=[
    "📋 تقرير متابعة: "+($("subj").value.trim()||"…"),
    "👤 مسؤول المادة: "+($("lead").value.trim()||"…"),
    "📅 "+d
  ].join("\n");
  const body=[section("🔷 المحاضرات",rows.lec),section("🔶 البنوك",rows.bank)].filter(Boolean).join("\n\n");
  const text=parts+(body?"\n\n"+body:"");
  $("out").textContent=text;
  return text;
}

function say(t){$("msg").textContent=t}

$("subj").oninput=build;
$("lead").oninput=()=>{save();build()};
document.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>addRow(b.dataset.add));

$("copy").onclick=async()=>{
  const t=build();
  try{await navigator.clipboard.writeText(t);say("تم النسخ.")}
  catch(e){
    const ta=el("textarea",{value:t});document.body.appendChild(ta);ta.select();
    try{document.execCommand("copy");say("تم النسخ.")}catch(_){say("تعذّر النسخ، انسخ النص يدوياً من الأعلى.")}
    ta.remove();
  }
};

$("tg").onclick=()=>{
  const t=build();
  if(!$("subj").value.trim()){say("اكتب اسم المادة أولاً.");return}
  if(!rows.lec.concat(rows.bank).some(r=>r.name.trim())){say("أضف محاضرة أو بنك واحد على الأقل.");return}
  window.open("https://t.me/share/url?url=&text="+encodeURIComponent(t),"_blank");
  say("اختر المستلم في تيليجرام ثم اضغط إرسال.");
};

load();addRow("lec");addRow("bank");build();
</script>
</body>
</html>
