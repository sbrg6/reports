*{box-sizing:border-box}
html,body{margin:0}
body{min-height:100vh;background:radial-gradient(900px 520px at 90% -10%,var(--glow),transparent 60%),linear-gradient(180deg,var(--surface),var(--bg) 55%) fixed;color:var(--text);font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased}
.app{max-width:720px;margin:0 auto;padding:14px 16px 90px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:4px 0 8px}
.logo{width:116px}
.logo img{width:100%;height:auto;display:block}
.me{display:flex;align-items:center;gap:4px;color:var(--muted);font-size:.86rem;flex-wrap:wrap;justify-content:flex-end}
.ibtn{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:10px;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;transition:color .2s,border-color .2s}
.ibtn:hover{color:var(--text);border-color:var(--accent)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1{font-size:1.5rem;font-weight:700;margin:16px 0 2px}
h2{font-size:1.02rem;font-weight:700;margin:0}
.sub{color:var(--muted);font-size:.92rem;margin:0 0 14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0 14px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:12px 14px}
.stat b{display:block;font-size:1.55rem;line-height:1.1;font-weight:700}
.stat span{color:var(--muted);font-size:.8rem}
.stat.ok b{color:var(--ok)}
.stat.warn b{color:var(--warn)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:12px;color:var(--text)}
.late{display:flex;align-items:center;justify-content:space-between;width:100%;text-align:start;border-color:var(--warn);cursor:pointer;font:inherit;font-weight:600;gap:10px}
.chip{display:inline-flex;align-items:center;font-size:.75rem;font-weight:600;border-radius:999px;padding:1px 10px;background:var(--warn);color:#1a1205}
.badge{font-size:.72rem;font-weight:600;color:var(--accent);border:1px solid var(--accent);border-radius:999px;padding:0 9px}
.grid{display:grid;gap:12px}
@media (min-width:620px){.grid{grid-template-columns:1fr 1fr}}
.subj{display:block;width:100%;text-align:start;cursor:pointer;font:inherit;transition:transform .2s,border-color .2s,box-shadow .2s}
.subj:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 12px 30px -18px var(--accent)}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.pips{display:flex;gap:5px;margin:12px 0 8px}
.pip{flex:1;height:6px;border-radius:99px;background:var(--surface2)}
.pip.on{background:var(--accent)}
.pip.redo{background:var(--warn)}
.cap{color:var(--muted);font-size:.84rem}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:inherit;font-weight:600;font-size:.92rem;border-radius:12px;padding:10px 14px;border:1px solid var(--border);background:var(--surface2);color:var(--text);cursor:pointer;transition:transform .15s,border-color .2s,filter .2s}
.btn:hover{border-color:var(--accent)}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger)}
.btn.block{width:100%}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.section-h{display:flex;align-items:center;justify-content:space-between;margin:24px 0 8px}
.item{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:10px;animation:rise .35s both}
.item-h{display:flex;align-items:center;gap:8px}
.item-h strong{flex:1;font-size:1rem}
.name-in{flex:1;background:transparent;border:0;border-bottom:1px dashed var(--border);color:var(--text);font:inherit;font-weight:600;padding:4px 0;border-radius:0}
.stepper{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:14px 0 8px}
.step{height:34px;border-radius:10px;border:1px solid var(--border);background:var(--surface2);color:var(--muted);font:inherit;font-size:.72rem;cursor:pointer;transition:background .25s,border-color .25s,color .25s;padding:0}
.step.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.step.cur{box-shadow:0 0 0 2px var(--accent)}
.step[disabled]{cursor:default}
.stage{font-size:.92rem;font-weight:500}
.stage.redo{color:var(--warn)}
.note{margin-top:10px;width:100%;background:var(--surface2);border:1px solid var(--border);color:var(--text);font:inherit;font-size:.9rem;border-radius:10px;padding:9px 11px}
.redo-btn{background:none;border:0;color:var(--warn);font:inherit;font-size:.84rem;cursor:pointer;padding:6px 0 0}
.add{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:6px}
input,select{width:100%;font:inherit;color:var(--text);background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:11px 12px}
.ov{position:fixed;inset:0;background:rgba(3,6,16,.66);display:flex;align-items:flex-end;justify-content:center;z-index:30;animation:fade .2s both}
.sheet{background:var(--surface);border:1px solid var(--border);border-radius:20px 20px 0 0;width:100%;max-width:720px;max-height:88vh;overflow:auto;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));animation:up .28s cubic-bezier(.2,.7,.2,1) both}
.sheet h2{margin-bottom:12px;font-size:1.1rem}
.pre{white-space:pre-wrap;word-break:break-word;font:inherit;font-size:.88rem;background:var(--surface2);border:1px solid var(--border);border-radius:14px;padding:14px;margin:10px 0}
.lrow{display:block;width:100%;text-align:start;background:none;border:0;border-top:1px solid var(--border);padding:12px 0;color:var(--text);cursor:pointer;font:inherit}
.arow{display:grid;gap:8px;padding:12px 0;border-top:1px solid var(--border)}
.arow-2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.msg{color:var(--muted);font-size:.88rem;min-height:1.3em;margin:6px 0 0}
.tgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin:8px 0}
.tcard{border:1px solid var(--border);border-radius:14px;padding:10px;background:var(--surface2);color:var(--text);cursor:pointer;font:inherit;font-size:.84rem;display:flex;flex-direction:column;gap:8px;align-items:center}
.tcard.on{border-color:var(--accent)}
.tsw{width:100%;height:40px;border-radius:10px}
.login{max-width:380px;margin:10vh auto 0}
.login .logo{width:150px;margin:0 auto 18px}
.login h1,.login .sub{text-align:center}
#toast{position:fixed;inset-inline:0;bottom:calc(18px + env(safe-area-inset-bottom,0px));margin:auto;width:max-content;max-width:90%;background:var(--text);color:var(--bg);border-radius:12px;padding:9px 16px;font-size:.9rem;opacity:0;transform:translateY(8px);transition:opacity .22s,transform .22s;pointer-events:none;z-index:50}
#toast.on{opacity:1;transform:none}
.view{animation:rise .35s both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

function el(tag,props,kids){
  const e=document.createElement(tag);
  Object.assign(e,props||{});
  (kids||[]).forEach(k=>{if(k)e.appendChild(typeof k==="string"?document.createTextNode(k):k)});
  return e;
}
function B(cls,icon,label,onclick){return el("button",{className:"btn "+cls,innerHTML:(icon?ic(icon,16):"")+"<span>"+label+"</span>",onclick})}
function IB(icon,title,onclick){return el("button",{className:"ibtn",title,innerHTML:ic(icon,17),onclick})}
function toast(t){
  const x=document.getElementById("toast");
  x.textContent=t;x.classList.add("on");
  clearTimeout(toast.t);toast.t=setTimeout(()=>x.classList.remove("on"),2400);
}
function openSheet(title,nodes){
  const ov=el("div",{className:"ov",onclick:e=>{if(e.target===ov)ov.remove()}});
  ov.appendChild(el("div",{className:"sheet"},[el("h2",{textContent:title})].concat(nodes,[B("ghost","","إغلاق",()=>ov.remove())])));
  document.body.appendChild(ov);

}

const p2=n=>String(n).padStart(2,"0");
const fmt=d=>{const x=new Date(d);return p2(x.getDate())+"/"+p2(x.getMonth()+1)};
const daysSince=d=>Math.floor((Date.now()-new Date(d).getTime())/864e5);
const isLate=i=>i.stage!==PUB&&daysSince(i.since)>=LATE_DAYS;
const isAdmin=()=>prof&&prof.role==="admin";
function weekWord(){const w=Math.max(1,Math.floor((Date.now()-SEM_START)/864e5/7)+1);return ORD[Math.min(w,ORD.length)-1]}
function hashtags(){return "#السنة_الثانية_الفصل_الأول\n#تقرير_تجهيز_الأسبوع_"+weekWord()}
function subjectPreview(s){
  let out=s.name+":";
  KINDS.forEach(([k,title,verb])=>{
    const its=s.items.filter(i=>i.kind===k).sort((a,b)=>a.id-b.id);
    const done=its.filter(i=>i.stage===PUB).length;
    out+="\n\n• "+title.replace("القسم ","")+": (المجمل "+its.length+" محاضرات)";
    if(!its.length){out+="\n- "+(k==="practical"?"مافي عملي":"لم يتم رفع شي بعد");return}
    if(done)out+=k==="bank"?"\n- تم تجهيز "+done+".":"\n- تم رفع "+done+" على البوت.";
    its.filter(i=>i.stage!==PUB).forEach(i=>{
      out+="\n- "+i.name+" "+WHERE[i.stage]+(i.note&&i.note.trim()?" ("+i.note.trim()+")":"")+".";
    });
  });
  return out;
}
function previewText(list){
  return hashtags()+"\n\n"+list.map(subjectPreview).join("\n\n")+"\n\n[ إنجاز هذا الأسبوع متراجع عن الأسبوع الماضي🥀]";
}

async function fnCall(body){
  const {data:{session}}=await sb.auth.getSession();
  if(!session)return {ok:false,description:"سجّل دخول من جديد"};
  try{
    const r=await fetch(SB_URL+"/functions/v1/dynamic-worker",{method:"POST",headers:{"Authorization":"Bearer "+session.access_token,"apikey":SB_KEY,"Content-Type":"application/json"},body:JSON.stringify(body)});
    return await r.json().catch(()=>({ok:false,description:"خطأ "+r.status}));
  }catch(e){return {ok:false,description:"خطأ شبكة"}}
}
async function sendGroup(btn){
  if(!confirm("نرسل التقرير للمجموعة الآن؟"))return;
  const old=btn.innerHTML;
  btn.disabled=true;
  try{
    const x=await fnCall({});
    if(x.ok)toast("انرسل التقرير للمجموعة ✓");
    else toast("ما انرسل: "+(x.description||""));
  }catch(e){toast("خطأ شبكة، جرّب مرة تانية")}
  finally{btn.disabled=false;btn.innerHTML=old}
}

async function save(it,patch){
  const now=new Date().toISOString();
  const body={...patch,updated_at:now};
  if("stage" in patch)body.since=now;
  const {error}=await sb.from("items").update(body).eq("id",it.id);
  if(error){toast("تعذّر الحفظ: "+error.message);return false}
  Object.assign(it,patch);
  if(body.since)it.since=now;
  toast("تم الحفظ ✓");
  return true;
}

function itemCard(it,edit){
  const card=el("div",{className:"item"});
  const render=()=>{
    card.textContent="";
    const redo=it.stage===REDO,late=isLate(it);
    const head=el("div",{className:"item-h"});
    if(edit){
      const nm=el("input",{className:"name-in",value:it.name});
      nm.onchange=()=>save(it,{name:nm.value.trim()||it.name});
      head.appendChild(nm);
      head.appendChild(IB("trash","حذف الملف",async()=>{
        if(!confirm("حذف «"+it.name+"»؟"))return;
        const {error}=await sb.from("items").delete().eq("id",it.id);
        if(error){toast("تعذّر الحذف");return}
        cur.items=cur.items.filter(x=>x.id!==it.id);
        showDetail(cur);
      }));
    }else head.appendChild(el("strong",{textContent:it.name}));
    const stepper=el("div",{className:"stepper"});
    STEP_LABELS.forEach((lab,i)=>{
      const on=!redo&&i<=it.stage;
      const b=el("button",{className:"step"+(on?" on":"")+(!redo&&i===it.stage?" cur":""),textContent:lab,disabled:!edit,title:STAGES[i]});
      b.onclick=async()=>{if(await save(it,{stage:i}))render()};
      stepper.appendChild(b);
    });
    card.append(head,stepper,
      el("div",{className:"stage"+(redo?" redo":""),textContent:redo?"رجعت للتعديل":STAGES[it.stage]}),
      el("div",{className:"cap",textContent:it.stage===PUB?"":"من "+fmt(it.since)+(late?" · متأخر "+daysSince(it.since)+" يوم":"")})
    );
    if(edit){
      if(!redo)card.appendChild(el("button",{className:"redo-btn",textContent:"↩ رجّعه للتعديل",onclick:async()=>{if(await save(it,{stage:REDO}))render()}}));
      const note=el("input",{className:"note",placeholder:"السبب أو ملاحظة (تظهر بالتقرير)",value:it.note||""});
      note.onchange=()=>save(it,{note:note.value.trim()});
      card.appendChild(note);
    }else if(it.note)card.appendChild(el("div",{className:"cap",textContent:it.note}));
  };
  render();
  return card;
}

function showDetail(s){
  cur=s;
  closeSheets();
  const edit=s.lead_id===me.id;
  const head=[
    B("ghost","","→ كل المواد",async()=>{await loadSubjects();showList()}),
    el("h1",{textContent:s.name}),
    el("p",{className:"sub",textContent:edit?"حدّد المرحلة لكل ملف، وكل تغيير بينحفظ فوراً.":"عرض فقط. التعديل لمسؤول المادة."}),
    el("div",{className:"btns"},[B("ghost","doc","تقرير المادة",()=>showReport([s]))])
  ];
  const sections=[];
  KINDS.forEach(([kind,title,,ph])=>{
    const its=s.items.filter(i=>i.kind===kind).sort((a,b)=>a.id-b.id);
    sections.push(el("div",{className:"section-h"},[el("h2",{textContent:title}),el("span",{className:"cap",textContent:its.length+" ملف"})]));
    if(!its.length)sections.push(el("p",{className:"cap",textContent:kind==="practical"?"ما في عملي (أو ما انضاف لسا).":"ما في ملفات لسا."}));
    its.forEach(it=>sections.push(itemCard(it,edit)));
    if(edit){
      const nm=el("input",{placeholder:"اسم الملف (مثال: "+ph+")"});
      const add=B("primary","plus","إضافة",async()=>{
        const v=nm.value.trim();
        if(!v){toast("اكتب اسم الملف أولاً");nm.focus();return}
        const {data,error}=await sb.from("items").insert({subject_id:s.id,kind,name:v}).select("id,kind,name,stage,note,since").single();
        if(error){toast("تعذّرت الإضافة: "+error.message);return}
        s.items.push(data);
        showDetail(s);
      });
      sections.push(el("div",{className:"add"},[nm,add]));
    }
  });
  mount(el("div",{className:"view"},head.concat(sections)));
}

    const x=await fnCall({action:"create_user",name:nm.value.trim(),email:em.value.trim(),password:pw.value});
    b.disabled=false;
    if(x.ok){toast("انشأ الحساب ✓ اربطه بمادة من فوق");renderAccounts(box)}
    else toast("ما انشأ: "+(x.description||""));
  })]));
  r.users.forEach(u=>{
    const np=el("input",{type:"text",placeholder:"كلمة سر جديدة",autocomplete:"off"});
    box.appendChild(el("div",{className:"arow"},[
      el("strong",{textContent:(u.name||"بدون اسم")+" · "+u.email+(u.role==="admin"?" (أدمن)":"")}),
      el("div",{className:"arow-2"},[np,B("ghost","","تغيير كلمة السر",async()=>{
        if(np.value.length<6){toast("6 أحرف على الأقل");return}
        const x=await fnCall({action:"set_password",user_id:u.id,password:np.value});
        if(x.ok){toast("تغيّرت كلمة السر ✓");np.value=""}
        else toast("ما تغيّرت: "+(x.description||""));
      })]),
      B("danger","trash","حذف الحساب",async()=>{
        if(!confirm("نحذف حساب "+u.email+"؟ المادة اللي إلو بتصير بدون مسؤول."))return;
        const x=await fnCall({action:"delete_user",user_id:u.id});
        if(x.ok){toast("انحذف الحساب ✓");renderAccounts(box)}
        else toast("ما انحذف: "+(x.description||""));
      })
    ]));
  });
}

async function showArchive(){
  closeSheets();
  const {data,error}=await sb.from("reports").select("id,created_at,source,body").order("created_at",{ascending:false}).limit(40);
  if(error){toast("تعذّر تحميل الأرشيف: "+error.message);return}
  const nodes=(data||[]).map(r=>{
    const when=new Date(r.created_at).toLocaleString("ar-SY",{dateStyle:"medium",timeStyle:"short"});
    const who=r.source==="auto"?"تلقائي (جمعة 8 مساءً)":"يدوي";
    return el("details",{className:"arow"},[el("summary",{textContent:when+" · "+who}),el("pre",{className:"pre",textContent:r.body})]);
  });
  if(!nodes.length)nodes.push(el("p",{className:"cap",textContent:"ما في تقارير محفوظة لسا."}));
  openSheet("الأرشيف",nodes);
}

async function showChanges(){
  closeSheets();
  const {data,error}=await sb.from("changes").select("created_at,actor_name,action,item_name,detail").order("created_at",{ascending:false}).limit(100);
  if(error){toast("تعذّر تحميل السجل: "+error.message);return}
  const tr=d=>(d||"").split(" ").filter(Boolean).map(x=>x.startsWith("stage:")?"صار: "+(STAGES[+x.slice(6)]||""):(CH_LBL[x]||x)).join(" · ");
  const nodes=(data||[]).map(c=>{
    const when=new Date(c.created_at).toLocaleString("ar-SY",{dateStyle:"short",timeStyle:"short"});
    return el("div",{className:"arow"},[el("div",{className:"cap",textContent:when+" · "+(c.actor_name||"نظام")}),el("div",{textContent:(c.item_name||"")+(c.detail?" · "+tr(c.detail):"")})]);
  });
  if(!nodes.length)nodes.push(el("p",{className:"cap",textContent:"ما في تغييرات مسجّلة لسا."}));
  openSheet("السجل",nodes);
}

async function backup(){
  const {data:pr}=await sb.from("profiles").select("id,name");
  const who={};(pr||[]).forEach(p=>who[p.id]=p.name);
  const KL={lecture:"نظري",practical:"عملي",bank:"بنك"};
  const rows=[["المادة","المسؤول","النوع","الملف","المرحلة","من تاريخ","السبب/ملاحظة"]];
  subjects.forEach(s=>s.items.slice().sort((a,b)=>a.id-b.id).forEach(i=>rows.push([s.name,who[s.lead_id]||"",KL[i.kind]||i.kind,i.name,STAGES[i.stage]||"مرفوعة",new Date(i.since).toISOString().slice(0,10),i.note||""])));
  const q=v=>'"'+String(v).replace(/"/g,'""')+'"';
  const csv="\ufeff"+rows.map(r=>r.map(q).join(",")).join("\r\n");
  const n=new Date();
  const a=el("a",{href:URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"})),download:"bluebits-backup-"+n.getFullYear()+"-"+p2(n.getMonth()+1)+"-"+p2(n.getDate())+".csv"});
  document.body.appendChild(a);a.click();a.remove();
  toast("تم تنزيل النسخة ✓");
}
