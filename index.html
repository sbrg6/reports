<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>متابعة المواد · Blue Bits</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#070e1f">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
  --bg:#070e1f;--bg2:#0c1730;--card:#0f1b38cc;--ink:#e8f0ff;--mute:#8da2c8;--line:#1e3158;
  --blue:#2c91ed;--glow:rgba(44,145,237,.35);--onblue:#04101f;--field:#0a1630;
  --c0:#26365c;--c1:#2a5f9e;--c2:#2c78cc;--c3:#2c91ed;--c4:#35d6a0;--c5:#f0a04b;
}
@media (prefers-color-scheme:light){
  :root{
    color-scheme:light;
    --bg:#eef4fc;--bg2:#dfeafa;--card:#ffffffd9;--ink:#0b1b3a;--mute:#566a8c;--line:#cfdcf0;
    --blue:#2c91ed;--glow:rgba(44,145,237,.28);--onblue:#fff;--field:#f6f9fe;
    --c0:#c9d6ea;--c1:#8fc0f4;--c2:#5aa6ee;--c3:#2c91ed;--c4:#12906a;--c5:#c2570c;
  }
  .logo-d{display:none}.logo-l{display:block}
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;line-height:1.65;min-height:100vh;
  background:radial-gradient(900px 500px at 85% -10%,var(--glow),transparent 60%),linear-gradient(180deg,var(--bg2),var(--bg) 60%) fixed}
main{max-width:560px;margin:0 auto;padding:10px 14px 80px}
h1{font-size:1.5rem;font-weight:700;margin:14px 0 4px}
h2{font-size:1rem;font-weight:700;margin:0}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
input{font:inherit;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
input:focus,button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0}
.logo{position:relative;overflow:hidden;width:132px;line-height:0}
.logo img{width:100%;height:auto}
.logo-l{display:none}
.logo::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.55) 50%,transparent 60%);transform:translateX(-120%);animation:sheen 1.8s .3s ease-out 1 forwards}
@keyframes sheen{to{transform:translateX(120%)}}
.who{color:var(--mute);font-size:.85rem}
.link{color:var(--blue);font-weight:500}
.hint{color:var(--mute);font-size:.9rem;margin:2px 0 10px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0 12px}
.stat,.panel,.item{background:var(--card);border:1px solid var(--line);border-radius:14px;backdrop-filter:blur(8px);animation:rise .5s both}
.stat{padding:10px 12px}
.stat b{display:block;font-size:1.6rem;line-height:1.1}
.stat span{color:var(--mute);font-size:.8rem}
.stat.ok b{color:var(--c4)}.stat.warn b{color:var(--c5)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
.panel{padding:14px;margin-bottom:12px}
.subj{display:block;width:100%;text-align:start;transition:border-color .2s,box-shadow .2s}
.subj:hover{border-color:var(--blue);box-shadow:0 0 0 3px var(--glow)}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.badge{font-size:.72rem;font-weight:700;color:var(--onblue);background:var(--blue);border-radius:6px;padding:0 8px}
.cells{display:flex;flex-wrap:wrap;gap:4px;margin:10px 0 6px}
.cell{width:18px;height:20px;background:var(--c0);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);animation:pop .45s var(--d,0s) both}
@keyframes pop{from{opacity:0;transform:scale(.3)}}
.s1{background:var(--c1)}.s2{background:var(--c2)}.s3{background:var(--c3)}.s4{background:var(--c4)}.s5{background:var(--c5)}
.cap{color:var(--mute);font-size:.85rem}
.kind{margin:20px 0 8px}
.item{padding:12px 14px;margin-bottom:10px}
.head{display:flex;align-items:center;gap:8px}
.nm{border:0;background:none;padding:0;font-weight:700;font-size:1.02rem}
.x{color:var(--mute);font-size:1.1rem;padding:4px 8px}
.steps{display:flex;gap:5px;margin:10px 0 6px}
.seg{flex:1;height:30px;display:flex;align-items:center}
.seg::before{content:"";display:block;width:100%;height:9px;border-radius:5px;background:var(--line);transition:background .35s,box-shadow .35s}
.seg.on::before{background:var(--c);box-shadow:0 0 10px -2px var(--c)}
.pulse .seg.on::before{animation:beat .5s}
@keyframes beat{50%{transform:scaleY(1.9)}}
.stlabel{font-size:.9rem;font-weight:500}
.since{color:var(--mute);font-size:.8rem}
.since.late{color:var(--c5);font-weight:700}
.cell.late{animation:pop .45s var(--d,0s) both,blink 1.8s 1s ease-in-out infinite}
@keyframes blink{50%{opacity:.4}}
.chip{font-size:.72rem;font-weight:700;color:var(--onblue);background:var(--c5);border-radius:6px;padding:0 8px}
.alert{display:flex;justify-content:space-between;align-items:center;width:100%;border-color:var(--c5);text-align:start}
.acts2{display:grid;gap:8px}
select{font:inherit;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
.arow{display:grid;gap:8px;padding:12px 0;border-top:1px solid var(--line)}
.danger{color:var(--c5);font-size:.85rem;text-align:start}
.lrow{display:block;width:100%;text-align:start;padding:10px 0;border-top:1px solid var(--line)}
.note{margin-top:8px;font-size:.9rem;padding:8px 10px}
.redo{font-size:.82rem;color:var(--c5);font-weight:500}
.addrow{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:4px}
.btn{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-weight:500}
.primary{background:var(--blue);border-color:var(--blue);color:var(--onblue);font-weight:700;width:100%;box-shadow:0 6px 20px -8px var(--blue)}
.msg{min-height:1.4em;color:var(--mute);font-size:.9rem}
.login{margin-top:10vh;animation:rise .6s both}.login input{margin-bottom:10px}
.dock{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom,0px));margin-top:16px;padding-top:16px;background:linear-gradient(transparent,var(--bg) 40%)}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 12px}
.tools .wide{grid-column:1 / 3}
.ov{position:fixed;inset:0;background:rgba(3,8,20,.7);display:flex;align-items:flex-end;justify-content:center;z-index:9;animation:rise .25s both}
.sheet{background:var(--bg2);border:1px solid var(--line);border-radius:18px 18px 0 0;width:100%;max-width:560px;max-height:88vh;overflow:auto;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.rep{white-space:pre-wrap;word-break:break-word;font:inherit;font-size:.88rem;background:var(--field);border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0}
.acts{display:grid;grid-template-columns:1.4fr 1fr;gap:10px;margin-bottom:10px}
#toast{position:fixed;inset-inline:0;bottom:calc(16px + env(safe-area-inset-bottom,0px));margin:auto;width:max-content;max-width:90%;background:var(--ink);color:var(--bg);border-radius:10px;padding:8px 16px;font-size:.9rem;opacity:0;transition:opacity .2s;pointer-events:none;z-index:10}
#toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>

const SEM_START=new Date("2026-10-11T00:00:00").getTime();
const ORD=["الأول","الثاني","الثالث","الرابع","الخامس","السادس","السابع","الثامن","التاسع","العاشر","الحادي_عشر","الثاني_عشر","الثالث_عشر","الرابع_عشر","الخامس_عشر","السادس_عشر"];
const STAGES=[
  ["✍️","عند العضو العلمي"],["💻","عند العضو التقني"],["🛠️","عند المسؤول التقني"],
  ["🔍","عند مسؤول المادة (تدقيق)"],["✅","مرفوعة"],["🔁","رجعت للتعديل"]
];
const HOLD=["العضو العلمي","العضو التقني","المسؤول التقني","مسؤول المادة للتدقيق","","التعديل"];
const PUB=4,REDO=5;
const LATE_DAYS=4;
const daysSince=d=>Math.floor((Date.now()-new Date(d).getTime())/864e5);
const isLate=i=>i.stage!==PUB&&daysSince(i.since)>=LATE_DAYS;
const KINDS=[
  ["lecture","🔷 القسم النظري","تم رفع","محاضرة 3"],
  ["practical","🔷 القسم العملي","تم رفع","عملي 1"],
  ["bank","🔶 البنك","تم تجهيز","بنك 2"]
];
const app=document.getElementById("app");
let sb,me=null,prof=null,subjects=[],cur=null,tt;

function el(tag,props,kids){
  const e=document.createElement(tag);
  Object.assign(e,props||{});
  (kids||[]).forEach(k=>{if(k)e.appendChild(typeof k==="string"?document.createTextNode(k):k)});
  return e;
}
function toast(t){
  const x=document.getElementById("toast");
  x.textContent=t;x.classList.add("on");
  clearTimeout(tt);tt=setTimeout(()=>x.classList.remove("on"),2400);
}
function logo(){
  return el("div",{className:"logo"},[el("img",{className:"logo-d",src:LOGO_D,alt:"Blue Bits"}),el("img",{className:"logo-l",src:LOGO_L,alt:"Blue Bits"})]);
}
function mount(node){
  app.textContent="";
  const bar=el("div",{className:"bar"},[logo()]);
  if(me)bar.appendChild(el("span",{className:"who"},[((prof&&prof.name)||me.email)+" · ",el("button",{className:"link",textContent:"كلمة السر",onclick:showPw})," · ",el("button",{className:"link",textContent:"خروج",onclick:logout})]));
  app.appendChild(bar);app.appendChild(node);window.scrollTo(0,0);
}
function countUp(node,n){
  let i=0;const step=Math.max(1,Math.ceil(n/20));
  const t=setInterval(()=>{i=Math.min(n,i+step);node.textContent=i;if(i>=n)clearInterval(t)},30);
}
const p2=n=>String(n).padStart(2,"0");
const fmt=d=>{const x=new Date(d);return p2(x.getDate())+"/"+p2(x.getMonth()+1)};
function weekWord(){
  const w=Math.max(1,Math.floor((Date.now()-SEM_START)/864e5/7)+1);
  return ORD[Math.min(w,ORD.length)-1];
}

async function init(){
  if(typeof supabase==="undefined"){app.textContent="تعذّر تحميل مكتبة Supabase. تأكد من الإنترنت وحدّث الصفحة.";return}
  sb=supabase.createClient(SB_URL,SB_KEY);
  const {data}=await sb.auth.getSession();
  if(data.session){me=data.session.user;await afterLogin()}else showLogin();
}
async function afterLogin(){
  const {data}=await sb.from("profiles").select("name,role").eq("id",me.id).maybeSingle();
  prof=data||{name:me.email,role:"lead"};
  await loadSubjects();showList();
}
async function loadSubjects(){
  const {data,error}=await sb.from("subjects").select("id,name,lead_id,items(id,kind,name,stage,note,since)").order("name");
  if(error){toast("تعذّر تحميل المواد: "+error.message);subjects=[];return}
  subjects=data||[];
  if(cur)cur=subjects.find(s=>s.id===cur.id)||null;
}
async function logout(){await sb.auth.signOut();me=null;prof=null;subjects=[];cur=null;showLogin()}

function showLogin(){
  const em=el("input",{type:"email",placeholder:"الإيميل",autocomplete:"username"});
  const pw=el("input",{type:"password",placeholder:"كلمة السر",autocomplete:"current-password"});
  const msg=el("p",{className:"msg"});
  const f=el("form",{className:"login"},[
    el("h1",{textContent:"أهلاً فيك"}),
    el("p",{className:"hint",textContent:"سجّل دخول لتتابع مرحلة كل ملف بمادتك."}),
    em,pw,el("button",{className:"btn primary",type:"submit",textContent:"دخول"}),msg
  ]);
  f.onsubmit=async e=>{
    e.preventDefault();msg.textContent="جاري الدخول…";
    const {data,error}=await sb.auth.signInWithPassword({email:em.value.trim(),password:pw.value});
    if(error){msg.textContent="الإيميل أو كلمة السر غلط.";return}
    me=data.user;await afterLogin();
  };
  mount(f);
}

function reportFor(list){
  const n=new Date();
  const head="#السنة_الثانية_الفصل_الأول\n#تقرير_تجهيز_الأسبوع_"+weekWord()+"\n\nتاريخ "+n.getFullYear()+"/"+p2(n.getMonth()+1)+"/"+p2(n.getDate());
  const body=list.map(s=>{
    const secs=KINDS.map(([k,t,verb])=>{
      const its=s.items.filter(i=>i.kind===k).sort((a,b)=>a.id-b.id);
      const done=its.filter(i=>i.stage===PUB).length;
      let out=t.replace(/^🔷 /,"🔷").replace(/^🔶 /,"🔶 ")+":"+(k==="practical"&&!its.length?' "مافي عملي"':"")+"\n- "+verb+" ("+done+") محاضرة من أصل ("+its.length+")";
      its.filter(i=>i.stage!==PUB).forEach(i=>{
        out+="\n- "+i.name+" واقفة عند "+HOLD[i.stage]+" من تاريخ "+fmt(i.since)+(i.note&&i.note.trim()?" /"+i.note.trim()+"/":"")+".";
      });
      return out;
    }).join("\n\n");
    return "📌اسم المادة: "+s.name+"\n"+secs;
  }).join("\n\n");
  return head+"\n"+body;
}
function showReport(list){
  const text=reportFor(list);
  const ov=el("div",{className:"ov",onclick:e=>{if(e.target===ov)ov.remove()}},[
    el("div",{className:"sheet"},[
      el("h2",{textContent:"تقرير الأسبوع "+weekWord().replace(/_/g," ")}),
      el("pre",{className:"rep",textContent:text}),
      el("div",{className:"acts"},[
        el("button",{className:"btn primary",textContent:"إرسال عبر تيليجرام",onclick:()=>window.open("https://t.me/share/url?url=&text="+encodeURIComponent(text),"_blank")}),
        el("button",{className:"btn",textContent:"نسخ",onclick:async()=>{try{await navigator.clipboard.writeText(text);toast("تم النسخ ✓")}catch(e){toast("تعذّر النسخ")}}})
      ]),
      el("button",{className:"link",textContent:"إغلاق",onclick:()=>ov.remove()})
    ])
  ]);
  document.body.appendChild(ov);
}

async function fnCall(body){
  const {data:{session}}=await sb.auth.getSession();
  if(!session)return {ok:false,description:"سجّل دخول من جديد"};
  try{
    const r=await fetch(SB_URL+"/functions/v1/dynamic-worker",{method:"POST",headers:{"Authorization":"Bearer "+session.access_token,"apikey":SB_KEY,"Content-Type":"application/json"},body:JSON.stringify(body)});
    return await r.json().catch(()=>({ok:false,description:"خطأ "+r.status}));
  }catch(e){return {ok:false,description:"خطأ شبكة"}}
}

async function renderAccounts(box){
  box.textContent="";
  box.appendChild(el("h2",{textContent:"👥 الحسابات"}));
  const r=await fnCall({action:"list_users"});
  if(!r.ok){box.appendChild(el("p",{className:"msg",textContent:"تعذّر التحميل: "+(r.description||"")}));return}
  const nm=el("input",{placeholder:"اسم المسؤول"});
  const em=el("input",{type:"email",placeholder:"الإيميل (مثال: physics@bluebits.com)",autocomplete:"off"});
  const pw=el("input",{type:"text",placeholder:"كلمة السر (6 أحرف أو أكتر)",autocomplete:"off"});
  box.appendChild(el("div",{className:"arow"},[nm,em,pw,el("button",{className:"btn primary",textContent:"+ إنشاء حساب",onclick:async(e)=>{
    const b=e.currentTarget;b.disabled=true;
    const x=await fnCall({action:"create_user",name:nm.value.trim(),email:em.value.trim(),password:pw.value});
    b.disabled=false;
    if(x.ok){toast("انشأ الحساب ✓ اربطه بمادة من إدارة المواد");renderAccounts(box)}
    else toast("ما انشأ: "+(x.description||""));
  }})]));
  r.users.forEach(u=>{
    const np=el("input",{type:"text",placeholder:"كلمة سر جديدة",autocomplete:"off"});
    box.appendChild(el("div",{className:"arow"},[
      el("strong",{textContent:(u.name||"بدون اسم")+" · "+u.email+(u.role==="admin"?" (أدمن)":"")}),
      np,
      el("button",{className:"btn",textContent:"تغيير كلمة السر",onclick:async()=>{
        if(np.value.length<6){toast("6 أحرف على الأقل");return}
        const x=await fnCall({action:"set_password",user_id:u.id,password:np.value});
        if(x.ok){toast("تغيّرت كلمة السر ✓");np.value=""}
        else toast("ما تغيّرت: "+(x.description||""));
      }}),
      el("button",{className:"danger",textContent:"حذف",onclick:async()=>{
        if(!confirm("نحذف حساب "+u.email+"؟ المادة اللي إلو بتصير بدون مسؤول."))return;
        const x=await fnCall({action:"delete_user",user_id:u.id});
        if(x.ok){toast("انحذف الحساب ✓");renderAccounts(box)}
        else toast("ما انحذف: "+(x.description||""));
      }})
    ]));
  });
}

    toast("تم الحفظ ✓");return true;
  }
  async function refresh(){await loadSubjects();draw()}
  function draw(){
    sheet.textContent="";
    sheet.appendChild(el("h2",{textContent:"⚙️ إدارة المواد"}));
    const nn=el("input",{placeholder:"اسم مادة جديدة"});
    const ns=leadSel("");
    sheet.appendChild(el("div",{className:"arow"},[nn,ns,el("button",{className:"btn primary",textContent:"+ إضافة مادة",onclick:async()=>{
      const v=nn.value.trim();
      if(!v){toast("اكتب اسم المادة أولاً");return}
      const {error}=await sb.from("subjects").insert({name:v,lead_id:ns.value||null});
      if(error){toast("تعذّرت الإضافة: "+error.message);return}
      toast("انضافت المادة ✓");await refresh();
    }})]));
    subjects.forEach(s=>{
      const nm=el("input",{value:s.name});
      nm.onchange=async()=>{const v=nm.value.trim();if(!v){nm.value=s.name;return}if(await upd(s.id,{name:v}))s.name=v};
      const sel=leadSel(s.lead_id);
      sel.onchange=async()=>{if(await upd(s.id,{lead_id:sel.value||null}))s.lead_id=sel.value||null};
      const del=el("button",{className:"danger",textContent:"حذف المادة وكل ملفاتها",onclick:async()=>{
        if(!confirm("حذف «"+s.name+"» وكل ملفاتها نهائياً؟"))return;
        const {error}=await sb.from("subjects").delete().eq("id",s.id);
        if(error){toast("تعذّر الحذف: "+error.message);return}
        toast("انحذفت المادة");await refresh();
      }});
      sheet.appendChild(el("div",{className:"arow"},[nm,sel,del]));
    });
    const accBox=el("div");
    sheet.appendChild(accBox);
    renderAccounts(accBox);
    sheet.appendChild(el("button",{className:"link",textContent:"إغلاق",onclick:()=>{ov.remove();showList()}}));
  }
  document.body.appendChild(ov);draw();
}

async function sendGroup(btn){
  if(!confirm("نرسل التقرير للمجموعة الآن؟"))return;
  const old=btn.textContent;
  btn.disabled=true;btn.textContent="جاري الإرسال…";
  try{
    const {data:{session}}=await sb.auth.getSession();
    if(!session){toast("سجّل دخول من جديد");return}
    const r=await fetch(SB_URL+"/functions/v1/dynamic-worker",{
      method:"POST",
      headers:{"Authorization":"Bearer "+session.access_token,"apikey":SB_KEY,"Content-Type":"application/json"},
      body:"{}"
    });
    const j=await r.json().catch(()=>({}));
    if(j.ok)toast("انرسل التقرير للمجموعة ✓");
    else toast("ما انرسل: "+(j.description||("خطأ "+r.status)));
  }catch(e){toast("خطأ شبكة، جرّب مرة تانية")}
  finally{btn.disabled=false;btn.textContent=old}
}

async function showArchive(){
  const {data,error}=await sb.from("reports").select("id,created_at,source,body").order("created_at",{ascending:false}).limit(40);
  if(error){toast("تعذّر تحميل الأرشيف: "+error.message);return}
  const ov=el("div",{className:"ov",onclick:e=>{if(e.target===ov)ov.remove()}});
  const sheet=el("div",{className:"sheet"},[el("h2",{textContent:"📚 أرشيف التقارير"})]);
  if(!(data||[]).length)sheet.appendChild(el("p",{className:"hint",textContent:"ما في تقارير محفوظة لسا."}));
  (data||[]).forEach(r=>{
    const when=new Date(r.created_at).toLocaleString("ar-SY",{dateStyle:"medium",timeStyle:"short"});
    const who=r.source==="auto"?"تلقائي (جمعة 8 مساءً)":"يدوي";
    sheet.appendChild(el("details",{className:"arow"},[
      el("summary",{textContent:when+" · "+who}),
      el("pre",{className:"rep",textContent:r.body})
    ]));
  });
  sheet.appendChild(el("button",{className:"link",textContent:"إغلاق",onclick:()=>ov.remove()}));
  ov.appendChild(sheet);
  document.body.appendChild(ov);
}

const CH_LBL={add_item:"أضيف ملف",del_item:"انحذف ملف",add_subject:"أضيفت مادة",del_subject:"انحذفت مادة",note:"تعديل السبب",rename:"تغيّر الاسم",lead:"تغيّر المسؤول"};
const CH_ST=["عند العضو العلمي","عند العضو التقني","عند المسؤول التقني","عند مسؤول المادة (تدقيق)","مرفوعة","رجع للتعديل"];
function chTr(d){return (d||"").split(" ").filter(Boolean).map(x=>x.startsWith("stage:")?"صار: "+(CH_ST[+x.slice(6)]||""):(CH_LBL[x]||x)).join(" · ")}

async function showChanges(){
  const {data,error}=await sb.from("changes").select("created_at,actor_name,action,item_name,detail").order("created_at",{ascending:false}).limit(100);
  if(error){toast("تعذّر تحميل السجل: "+error.message);return}
  const ov=el("div",{className:"ov",onclick:e=>{if(e.target===ov)ov.remove()}});
  const sheet=el("div",{className:"sheet"},[el("h2",{textContent:"🕘 سجل التغييرات"})]);
  if(!(data||[]).length)sheet.appendChild(el("p",{className:"hint",textContent:"ما في تغييرات مسجّلة لسا."}));
  (data||[]).forEach(c=>{
    const when=new Date(c.created_at).toLocaleString("ar-SY",{dateStyle:"short",timeStyle:"short"});
    const what=(c.item_name||"")+(c.detail?" · "+chTr(c.detail):"");
    sheet.appendChild(el("div",{className:"arow"},[
      el("div",{className:"since",textContent:when+" · "+(c.actor_name||"نظام")}),
      el("div",{textContent:what})
    ]));
  });
  sheet.appendChild(el("button",{className:"link",textContent:"إغلاق",onclick:()=>ov.remove()}));
  ov.appendChild(sheet);
  document.body.appendChild(ov);
}

async function backup(){
  const {data:pr}=await sb.from("profiles").select("id,name");
  const who={};(pr||[]).forEach(p=>who[p.id]=p.name);
  const KL={lecture:"نظري",practical:"عملي",bank:"بنك"};
  const rows=[["المادة","المسؤول","النوع","الملف","المرحلة","من تاريخ","السبب/ملاحظة"]];
  subjects.forEach(s=>s.items.slice().sort((a,b)=>a.id-b.id).forEach(i=>rows.push([s.name,who[s.lead_id]||"",KL[i.kind]||i.kind,i.name,STAGES[i.stage][1],new Date(i.since).toISOString().slice(0,10),i.note||""])));
  const q=v=>'"'+String(v).replace(/"/g,'""')+'"';
  const csv="\ufeff"+rows.map(r=>r.map(q).join(",")).join("\r\n");
  const n=new Date();
  const a=el("a",{href:URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"})),download:"bluebits-backup-"+n.getFullYear()+"-"+p2(n.getMonth()+1)+"-"+p2(n.getDate())+".csv"});
  document.body.appendChild(a);a.click();a.remove();
  toast("تم تنزيل النسخة ✓");
}

function showPw(){
  const a=el("input",{type:"password",placeholder:"كلمة السر الجديدة (6 أحرف على الأقل)",autocomplete:"new-password"});
  const b=el("input",{type:"password",placeholder:"أعد كتابتها",autocomplete:"new-password"});
  const msg=el("p",{className:"msg"});
  const ov=el("div",{className:"ov",onclick:e=>{if(e.target===ov)ov.remove()}},[
    el("div",{className:"sheet"},[
      el("h2",{textContent:"تغيير كلمة السر"}),
      el("div",{style:"height:10px"}),a,el("div",{style:"height:8px"}),b,msg,
      el("button",{className:"btn primary",textContent:"حفظ",onclick:async()=>{
        if(a.value.length<6){msg.textContent="كلمة السر لازم تكون 6 أحرف أو أكتر.";return}
        if(a.value!==b.value){msg.textContent="الكلمتين مو متطابقتين.";return}
        msg.textContent="جاري الحفظ…";
        const {error}=await sb.auth.updateUser({password:a.value});
        if(error){msg.textContent="تعذّر الحفظ: "+error.message;return}
        ov.remove();toast("تم تغيير كلمة السر ✓");
      }}),
      el("button",{className:"link",textContent:"إلغاء",onclick:()=>ov.remove()})
    ])
  ]);
  document.body.appendChild(ov);
  a.focus();
}

function showLate(list){
  list.sort((a,b)=>new Date(a.i.since)-new Date(b.i.since));
  const ov=el("div",{className:"ov",onclick:e=>{if(e.target===ov)ov.remove()}},[
    el("div",{className:"sheet"},[el("h2",{textContent:"⏰ ملفات متأخرة ("+LATE_DAYS+" أيام أو أكتر)"})].concat(
      list.map(({s,i})=>el("button",{className:"lrow",onclick:()=>{ov.remove();showDetail(s)}},[
        el("strong",{textContent:s.name+" · "+i.name}),
        el("div",{className:"since late",textContent:"واقفة عند "+HOLD[i.stage]+" من "+daysSince(i.since)+" يوم"})
      ])),
      [el("button",{className:"link",textContent:"إغلاق",onclick:()=>ov.remove()})]
    ))
  ]);
  document.body.appendChild(ov);
}

function showList(){
  cur=null;
  const all=subjects.flatMap(s=>s.items);
  const pub=all.filter(i=>i.stage===PUB).length,redo=all.filter(i=>i.stage===REDO).length;
  const stat=(n,l,c,d)=>{const b=el("b",{textContent:"0"});countUp(b,n);const s=el("div",{className:"stat "+(c||"")},[b,el("span",{textContent:l})]);s.style.animationDelay=d+"s";return s};
  const wrap=el("div",{},[
    el("h1",{textContent:"المواد"}),
    el("div",{className:"stats"},[stat(all.length,"ملف","",0),stat(pub,"مرفوع","ok",.08),stat(redo,"للتعديل","warn",.16)])
  ]);
  const tools=[];
  if(subjects.length)tools.push(el("button",{className:"btn primary wide",textContent:"📋 تقرير الأسبوع",onclick:()=>showReport(subjects)}));
  if(prof&&prof.role==="admin"){
    tools.push(el("button",{className:"btn primary wide",textContent:"📤 إرسال للمجموعة",onclick:e=>sendGroup(e.currentTarget)}));
    tools.push(el("button",{className:"btn",textContent:"⚙️ إدارة المواد",onclick:showAdmin}));
    tools.push(el("button",{className:"btn",textContent:"⬇️ نسخة احتياطية",onclick:backup}));
    tools.push(el("button",{className:"btn",textContent:"📚 الأرشيف",onclick:showArchive}));
    tools.push(el("button",{className:"btn",textContent:"🕘 السجل",onclick:showChanges}));
  }
  if(tools.length)wrap.appendChild(el("div",{className:"tools"},tools));
  const lateAll=subjects.flatMap(s=>s.items.filter(isLate).map(i=>({s,i})));
  if(lateAll.length)wrap.appendChild(el("button",{className:"panel alert",onclick:()=>showLate(lateAll)},[el("strong",{textContent:"⏰ ملفات متأخرة"}),el("span",{className:"chip",textContent:lateAll.length})]));
  if(!subjects.length)wrap.appendChild(el("p",{className:"hint",textContent:"ما في مواد ظاهرة لحسابك لسا. اطلب من الأدمن يربط مادة بحسابك."}));
  subjects.forEach((s,idx)=>{
    const its=s.items.slice().sort((a,b)=>a.id-b.id);
    const p=its.filter(i=>i.stage===PUB).length;
    const late=its.filter(isLate).length;
    const card=el("button",{className:"panel subj",onclick:()=>showDetail(s)},[
      el("div",{className:"top"},[el("h2",{textContent:s.name}),el("span",{},[late?el("span",{className:"chip",textContent:"⏰ "+late}):null," ",s.lead_id===me.id?el("span",{className:"badge",textContent:"مادتك"}):null])]),
      el("div",{className:"cells"},its.map((i,k)=>{const c=el("span",{className:"cell s"+i.stage+(isLate(i)?" late":""),title:i.name});c.style.setProperty("--d",(idx*.06+k*.03)+"s");return c})),
      el("div",{className:"cap",textContent:its.length?(p+" من "+its.length+" مرفوعة"):"ما في ملفات لسا"})
    ]);
    card.style.animationDelay=(.2+idx*.06)+"s";
    wrap.appendChild(card);
  });
  mount(wrap);
}

async function save(it,patch){
  const now=new Date().toISOString();
  const body={...patch,updated_at:now};
  if("stage" in patch)body.since=now;
  const {error}=await sb.from("items").update(body).eq("id",it.id);
  if(error){toast("تعذّر الحفظ: "+error.message);return false}
  Object.assign(it,patch);if(body.since)it.since=now;
  toast("تم الحفظ ✓");return true;
}

function itemCard(it,edit){
  const label=el("div",{className:"stlabel"}),since=el("div",{className:"since"});
  const steps=el("div",{className:"steps"});
  const card=el("div",{className:"item"});
  function paint(pulse){
    label.textContent=STAGES[it.stage][0]+" "+STAGES[it.stage][1];
    label.style.color=it.stage===REDO?"var(--c5)":"";
    const late=isLate(it);
    since.className="since"+(late?" late":"");
    since.textContent=it.stage===PUB?"":"من "+fmt(it.since)+(late?" · متأخر "+daysSince(it.since)+" يوم":"");
    steps.textContent="";
    for(let i=0;i<=PUB;i++){
      const on=it.stage!==REDO&&i<=it.stage;
      const seg=el("button",{className:"seg"+(on?" on":""),title:STAGES[i][1],disabled:!edit,onclick:async()=>{if(await save(it,{stage:i}))paint(true)}});
      seg.style.setProperty("--c","var(--c"+i+")");steps.appendChild(seg);
    }
    if(pulse){card.classList.remove("pulse");void card.offsetWidth;card.classList.add("pulse")}
  }
  paint();
  const head=el("div",{className:"head"});
  if(edit){
    const nm=el("input",{className:"nm",value:it.name});
    nm.onchange=()=>save(it,{name:nm.value.trim()||it.name});
    head.appendChild(nm);
    head.appendChild(el("button",{className:"x",textContent:"✕",title:"حذف",onclick:async()=>{
      if(!confirm("حذف «"+it.name+"»؟"))return;
      const {error}=await sb.from("items").delete().eq("id",it.id);
      if(error){toast("تعذّر الحذف");return}
      cur.items=cur.items.filter(x=>x.id!==it.id);showDetail(cur);
    }}));
  }else head.appendChild(el("strong",{textContent:it.name}));
  [head,steps,label,since].forEach(n=>card.appendChild(n));
  if(edit){
    card.appendChild(el("button",{className:"redo",textContent:"↩ رجّعوها للتعديل",onclick:async()=>{if(await save(it,{stage:REDO}))paint(true)}}));
    const note=el("input",{className:"note",placeholder:"السبب أو ملاحظة (بيظهر بالتقرير)",value:it.note||""});
    note.onchange=()=>save(it,{note:note.value.trim()});
    card.appendChild(note);
  }else if(it.note)card.appendChild(el("div",{className:"cap",textContent:it.note}));
  return card;
}

function showDetail(s){
  cur=s;
  const edit=s.lead_id===me.id;
  const wrap=el("div",{},[
    el("button",{className:"link",textContent:"→ كل المواد",onclick:async()=>{await loadSubjects();showList()}}),
    el("h1",{textContent:s.name}),
    el("p",{className:"hint",textContent:edit?"اضغط على المرحلة لتحديد وين وصل الملف.":"عرض فقط. التعديل لمسؤول المادة."})
  ]);
  KINDS.forEach(([kind,title,,ph])=>{
    wrap.appendChild(el("h2",{className:"kind",textContent:title}));
    const its=s.items.filter(i=>i.kind===kind).sort((a,b)=>a.id-b.id);
    if(!its.length)wrap.appendChild(el("p",{className:"hint",textContent:kind==="practical"?"ما في عملي (أو ما انضاف لسا).":"ما في ملفات لسا."}));
    its.forEach(it=>wrap.appendChild(itemCard(it,edit)));
    if(edit){
      const nm=el("input",{placeholder:"اسم الملف (مثال: "+ph+")"});
      const add=el("button",{className:"btn link",textContent:"+ إضافة",onclick:async()=>{
        const v=nm.value.trim();
        if(!v){toast("اكتب اسم الملف أولاً");nm.focus();return}
        const {data,error}=await sb.from("items").insert({subject_id:s.id,kind,name:v}).select("id,kind,name,stage,note,since").single();
        if(error){toast("تعذّرت الإضافة: "+error.message);return}
        s.items.push(data);showDetail(s);
      }});
      wrap.appendChild(el("div",{className:"addrow"},[nm,add]));
    }
  });
  wrap.appendChild(el("div",{className:"dock"},[el("button",{className:"btn primary",textContent:"📋 تقرير الأسبوع",onclick:()=>showReport([s])})]));
  mount(wrap);
}

if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
init();
</script>
</body>
