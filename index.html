<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="night">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>متابعة المواد · Blue Bits</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#08102a">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Blue Bits">
    <link rel="icon" type="image/png" href="Logo notext.png">
    <script>
        try {
            var t = localStorage.getItem("bb_theme"),
                C = {night:"#08102a", ink:"#070b14", gold:"#140e06", vangogh:"#0b1838", team:"#050d19", aurora:"#061320", ocean:"#04141c", code:"#03100b", sakura:"#1a0e1c"};
            if (C[t]) {
                document.documentElement.setAttribute("data-theme", t);
                document.querySelector("meta[name=theme-color]").content = C[t];
            }
        } catch(e) {}
    </script>

    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <canvas id="bg" aria-hidden="true"></canvas>
    <div id="splash" aria-hidden="true"><img src="Logo notext.png" alt="Blue Bits Logo"><i></i></div>
    <div id="app" class="app"></div>
    <div id="toast" role="status"></div>

    <!-- SDKs & Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js"></script>
    <script src="fx.js"></script>
    <script src="app.js"></script>
</body>
</html>
