<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>متابعة المواد</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#f3f6fb;--card:#fff;--ink:#12203a;--mute:#5d6b85;--line:#d9e1ee;
  --blue:#2457d6;--amber:#c76d0a;--field:#f8fafd;--onblue:#fff;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0e1626;--card:#16213a;--ink:#e8eefb;--mute:#93a2c0;--line:#2a3856;
    --blue:#6b95ff;--amber:#f0a04b;--field:#0f1a2f;--onblue:#0b1530;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0e1626;--card:#16213a;--ink:#e8eefb;--mute:#93a2c0;--line:#2a3856;
  --blue:#6b95ff;--amber:#f0a04b;--field:#0f1a2f;--onblue:#0b1530;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Cairo',system-ui,sans-serif;line-height:1.6}
main{max-width:560px;margin:0 auto;padding:14px 14px 60px}
h1{font-size:1.25rem;margin:8px 0 12px}
h2{margin:0;font-size:1.05rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.topbar{margin-bottom:6px;color:var(--mute);font-size:.9rem}
.hint{color:var(--mute);font-size:.88rem;margin:4px 0}
input,select{width:100%;font:inherit;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:8px;padding:9px 10px;margin-bottom:8px}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--field);color:var(--ink);padding:8px 12px}
.primary{background:var(--blue);border-color:var(--blue);color:var(--onblue);font-weight:700;padding:11px;width:100%}
.add{color:var(--blue);font-weight:600}
.back{margin-bottom:4px}
.subj{cursor:pointer}
.badge{background:var(--blue);color:var(--onblue);border-radius:99px;font-size:.75rem;padding:1px 10px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--blue)}
.lecture{border-inline-start:4px solid var(--blue)}
.bank{border-inline-start:4px solid var(--amber)}
.row{display:grid;grid-template-columns:1fr 1fr 40px;gap:8px;padding:10px 0;border-top:1px solid var(--line)}
.row input,.row select{margin:0}
.row .note{grid-column:1 / 3}
.row .del{grid-column:3;grid-row:1 / 3;align-self:stretch;color:var(--mute);padding:0}
.ro{padding:6px 0;border-top:1px solid var(--line)}
.addrow{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:10px}
.addrow input{margin:0}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.msg{min-height:1.4em;color:var(--mute);font-size:.9rem;margin:6px 0 0}
#toast{position:fixed;inset-inline:0;bottom:calc(16px + env(safe-area-inset-bottom,0px));margin:auto;width:max-content;max-width:90%;background:var(--ink);color:var(--bg);border-radius:99px;padding:8px 16px;font-size:.9rem;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.on{opacity:1}
</style>
</head>
<body>
<main id="app">جاري التحميل…</main>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js"></script>
<script>
const SB_URL="https://ejjhojeajjjbaczkcfwc.supabase.co";
const SB_KEY="sb_publishable__IyRTTMoM-xHtvGDU1wvnw_-5rryX9t";
const STAGES=[
  ["✍️","كتابة المحاضرة"],["💻","تفريغ إلكتروني"],["🔍","مراجعة العضو العملي"],
  ["📤","مرفوعة للمسؤول التقني"],["✅","منشورة على البوت"],["🔁","رجعت للتعديل"]
];
const PUB=4;
const KINDS=[["lecture","🔷 المحاضرات"],["bank","🔶 البنوك"]];
const app=document.getElementById("app");
let sb,me=null,prof=null,subjects=[],cur=null,tt;

function el(tag,props,kids){
  const e=document.createElement(tag);
  Object.assign(e,props||{});
  (kids||[]).forEach(k=>{if(k)e.appendChild(typeof k==="string"?document.createTextNode(k):k)});
  return e;
}
function toast(t){
  const x=document.getElementById("toast");
  x.textContent=t;x.classList.add("on");
  clearTimeout(tt);tt=setTimeout(()=>x.classList.remove("on"),2200);
}
function mount(node){
  app.textContent="";
  if(me)app.appendChild(el("div",{className:"top topbar"},[
    el("span",{textContent:(prof&&prof.name)||me.email}),
    el("button",{textContent:"خروج",onclick:logout})
  ]));
  app.appendChild(node);
}

async function init(){
  if(typeof supabase==="undefined"){app.textContent="تعذّر تحميل مكتبة Supabase. تأكد من الإنترنت وحدّث الصفحة.";return}
  sb=supabase.createClient(SB_URL,SB_KEY);
  const {data}=await sb.auth.getSession();
  if(data.session){me=data.session.user;await afterLogin()}else showLogin();
}
async function afterLogin(){
  const {data}=await sb.from("profiles").select("name,role").eq("id",me.id).maybeSingle();
  prof=data||{name:me.email,role:"lead"};
  await loadSubjects();
  showList();
}
async function loadSubjects(){
  const {data,error}=await sb.from("subjects").select("id,name,lead_id,items(id,kind,name,stage,note)").order("name");
  if(error){toast("تعذّر تحميل المواد: "+error.message);subjects=[];return}
  subjects=data||[];
  if(cur)cur=subjects.find(s=>s.id===cur.id)||null;
}
async function logout(){
  await sb.auth.signOut();
  me=null;prof=null;subjects=[];cur=null;showLogin();
}

function showLogin(){
  const em=el("input",{type:"email",placeholder:"الإيميل",autocomplete:"username"});
  const pw=el("input",{type:"password",placeholder:"كلمة السر",autocomplete:"current-password"});
  const msg=el("p",{className:"msg"});
  const f=el("form",{className:"card"},[
    el("h1",{textContent:"متابعة المواد"}),em,pw,
    el("button",{className:"primary",type:"submit",textContent:"دخول"}),msg
  ]);
  f.onsubmit=async e=>{
    e.preventDefault();msg.textContent="جاري الدخول…";
    const {data,error}=await sb.auth.signInWithPassword({email:em.value.trim(),password:pw.value});
    if(error){msg.textContent="الإيميل أو كلمة السر غلط.";return}
    me=data.user;await afterLogin();
  };
  mount(f);
}

function showList(){
  cur=null;
  const wrap=el("div",{},[el("h1",{textContent:"المواد"})]);
  if(!subjects.length)wrap.appendChild(el("p",{className:"hint",textContent:"ما في مواد ظاهرة لحسابك لسا. إذا كنت مسؤول مادة، اطلب من الأدمن يربط مادة بحسابك."}));
  subjects.forEach(s=>{
    const total=s.items.length,pub=s.items.filter(i=>i.stage===PUB).length;
    const pct=total?Math.round(pub/total*100):0;
    wrap.appendChild(el("div",{className:"card subj",onclick:()=>showDetail(s)},[
      el("div",{className:"top"},[
        el("strong",{textContent:s.name}),
        s.lead_id===me.id?el("span",{className:"badge",textContent:"مادتك"}):null
      ]),
      el("p",{className:"hint",textContent:total?(pub+" من "+total+" منشورة"):"ما في ملفات لسا"}),
      el("div",{className:"bar"},[el("i",{style:"width:"+pct+"%"})])
    ]));
  });
  mount(wrap);
}

async function save(it,patch){
  const {error}=await sb.from("items").update({...patch,updated_at:new Date().toISOString()}).eq("id",it.id);
  if(error){toast("تعذّر الحفظ: "+error.message);return}
  Object.assign(it,patch);toast("تم الحفظ ✓");
}

function itemRow(it,edit){
  const st=STAGES[it.stage]||STAGES[0];
  if(!edit)return el("div",{className:"ro",textContent:"• "+it.name+" ← "+st[0]+" "+st[1]+(it.note?" ("+it.note+")":"")});
  const name=el("input",{value:it.name});
  name.onchange=()=>save(it,{name:name.value.trim()||it.name});
  const sel=el("select");
  STAGES.forEach((x,i)=>sel.appendChild(el("option",{value:i,textContent:x[0]+" "+x[1],selected:i===it.stage})));
  sel.onchange=()=>save(it,{stage:+sel.value});
  const note=el("input",{className:"note",placeholder:"ملاحظة (اختياري)",value:it.note||""});
  note.onchange=()=>save(it,{note:note.value.trim()});
  const del=el("button",{className:"del",textContent:"✕",title:"حذف",onclick:async()=>{
    if(!confirm("حذف «"+it.name+"»؟"))return;
    const {error}=await sb.from("items").delete().eq("id",it.id);
    if(error){toast("تعذّر الحذف");return}
    cur.items=cur.items.filter(x=>x.id!==it.id);showDetail(cur);
  }});
  return el("div",{className:"row"},[name,sel,note,del]);
}

function reportText(){
  const head=[
    "📋 تقرير متابعة: "+cur.name,
    "👤 مسؤول المادة: "+((prof&&prof.name)||me.email),
    "📅 "+new Date().toLocaleDateString("en-GB")
  ].join("\n");
  const secs=KINDS.map(([k,t])=>{
    const its=cur.items.filter(i=>i.kind===k).sort((a,b)=>a.id-b.id);
    if(!its.length)return "";
    return t+"\n"+its.map(i=>"• "+i.name+" ← "+STAGES[i.stage][0]+" "+STAGES[i.stage][1]+(i.note&&i.note.trim()?" ("+i.note.trim()+")":"")).join("\n");
  }).filter(Boolean).join("\n\n");
  return head+(secs?"\n\n"+secs:"");
}

function showDetail(s){
  cur=s;
  const edit=s.lead_id===me.id;
  const wrap=el("div",{},[
    el("button",{className:"back",textContent:"→ كل المواد",onclick:async()=>{await loadSubjects();showList()}}),
    el("h1",{textContent:s.name})
  ]);
  if(!edit)wrap.appendChild(el("p",{className:"hint",textContent:"عرض فقط. التعديل لمسؤول المادة."}));
  KINDS.forEach(([kind,title])=>{
    const card=el("div",{className:"card "+kind},[el("h2",{textContent:title})]);
    const its=s.items.filter(i=>i.kind===kind).sort((a,b)=>a.id-b.id);
    if(!its.length)card.appendChild(el("p",{className:"hint",textContent:"ما في ملفات لسا."}));
    its.forEach(it=>card.appendChild(itemRow(it,edit)));
    if(edit){
      const nm=el("input",{placeholder:kind==="lecture"?"اسم المحاضرة (مثال: محاضرة 3)":"اسم البنك (مثال: بنك 2)"});
      const add=el("button",{className:"add",textContent:"+ إضافة",onclick:async()=>{
        const v=nm.value.trim();if(!v)return;
        const {data,error}=await sb.from("items").insert({subject_id:s.id,kind,name:v}).select("id,kind,name,stage,note").single();
        if(error){toast("تعذّرت الإضافة: "+error.message);return}
        s.items.push(data);showDetail(s);
      }});
      card.appendChild(el("div",{className:"addrow"},[nm,add]));
    }
    wrap.appendChild(card);
  });
  if(edit){
    wrap.appendChild(el("div",{className:"actions"},[
      el("button",{className:"primary",textContent:"إرسال التقرير عبر تيليجرام",onclick:()=>{
        window.open("https://t.me/share/url?url=&text="+encodeURIComponent(reportText()),"_blank");
      }}),
      el("button",{textContent:"نسخ التقرير",onclick:async()=>{
        try{await navigator.clipboard.writeText(reportText());toast("تم النسخ ✓")}
        catch(e){toast("تعذّر النسخ")}
      }})
    ]));
  }
  mount(wrap);
}

init();
</script>
</body>
</html>
