<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>متابعة المواد · Blue Bits</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#eef2f8;--grid:rgba(29,79,255,.07);--card:#fff;--ink:#0b1b3a;--mute:#5b6a86;--line:#d5deec;
  --blue:#1d4fff;--onblue:#fff;--field:#f6f8fc;
  --c0:#c9d3e6;--c1:#9db6ff;--c2:#6b8cff;--c3:#2f5cff;--c4:#12805c;--c5:#c2570c;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0a1226;--grid:rgba(111,147,255,.08);--card:#111c38;--ink:#e9eefc;--mute:#8ea0c4;--line:#22325a;
    --blue:#6f93ff;--onblue:#0a1226;--field:#0c1630;
    --c0:#2a3a63;--c1:#3f5aa8;--c2:#5476ea;--c3:#6f93ff;--c4:#3ccf9a;--c5:#f0a04b;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0a1226;--grid:rgba(111,147,255,.08);--card:#111c38;--ink:#e9eefc;--mute:#8ea0c4;--line:#22325a;
  --blue:#6f93ff;--onblue:#0a1226;--field:#0c1630;
  --c0:#2a3a63;--c1:#3f5aa8;--c2:#5476ea;--c3:#6f93ff;--c4:#3ccf9a;--c5:#f0a04b;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;line-height:1.65;
  background-color:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:26px 26px}
main{max-width:560px;margin:0 auto;padding:12px 14px 70px}
h1{font-size:1.45rem;font-weight:700;margin:14px 0 4px}
h2{font-size:1rem;font-weight:700;margin:0}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
input{font:inherit;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
input:focus,button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0 4px}
.brand{display:flex;align-items:center;gap:8px;font-weight:700}
.mark{display:grid;grid-template-columns:repeat(2,9px);gap:3px}
.mark i{width:9px;height:9px;border-radius:2px;background:var(--c0)}
.mark i:nth-child(1),.mark i:nth-child(4){background:var(--blue)}
.who{color:var(--mute);font-size:.85rem}
.link{color:var(--blue);font-weight:500}
.hint{color:var(--mute);font-size:.9rem;margin:2px 0 10px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0 14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-size:1.5rem;line-height:1.1}
.stat span{color:var(--mute);font-size:.8rem}
.stat.ok b{color:var(--c4)}.stat.warn b{color:var(--c5)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.subj{display:block;width:100%;text-align:start}
.subj .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.badge{font-size:.72rem;font-weight:700;color:var(--onblue);background:var(--blue);border-radius:6px;padding:0 8px}
.cells{display:flex;flex-wrap:wrap;gap:3px;margin:10px 0 6px}
.cell{width:14px;height:14px;border-radius:3px;background:var(--c0)}
.s1{background:var(--c1)}.s2{background:var(--c2)}.s3{background:var(--c3)}.s4{background:var(--c4)}.s5{background:var(--c5)}
.cap{color:var(--mute);font-size:.85rem}
.kind{margin:18px 0 8px;display:flex;justify-content:space-between;align-items:baseline}
.item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.item .nm{border:0;background:none;padding:0;font-weight:700;font-size:1.02rem}
.item .nm:focus{outline-offset:4px}
.head{display:flex;align-items:center;gap:8px}
.x{color:var(--mute);font-size:1.1rem;padding:4px 8px}
.steps{display:flex;gap:4px;margin:10px 0 6px}
.seg{flex:1;height:30px;display:flex;align-items:center}
.seg::before{content:"";display:block;width:100%;height:10px;border-radius:5px;background:var(--line)}
.seg.on::before{background:var(--c)}
.stlabel{font-size:.88rem;font-weight:500}
.item .note{margin-top:8px;font-size:.9rem;padding:8px 10px}
.redo{font-size:.82rem;color:var(--c5);font-weight:500}
.addrow{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:4px}
.btn{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-weight:500}
.primary{background:var(--blue);border-color:var(--blue);color:var(--onblue);font-weight:700;width:100%}
.acts{display:grid;grid-template-columns:1.4fr 1fr;gap:10px;margin-top:16px}
.msg{min-height:1.4em;color:var(--mute);font-size:.9rem}
.login{margin-top:12vh}
.login input{margin-bottom:10px}
#toast{position:fixed;inset-inline:0;bottom:calc(16px + env(safe-area-inset-bottom,0px));margin:auto;width:max-content;max-width:90%;background:var(--ink);color:var(--bg);border-radius:10px;padding:8px 16px;font-size:.9rem;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.on{opacity:1}
</style>
</head>
<body>
<main id="app">جاري التحميل…</main>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js"></script>
<script>
const SB_URL="https://ejjhojeajjjbaczkcfwc.supabase.co";
const SB_KEY="sb_publishable__IyRTTMoM-xHtvGDU1wvnw_-5rryX9t";
const STAGES=[
  ["✍️","كتابة المحاضرة"],["💻","تفريغ إلكتروني"],["🔍","مراجعة العضو العملي"],
  ["📤","مرفوعة للمسؤول التقني"],["✅","منشورة على البوت"],["🔁","رجعت للتعديل"]
];
const PUB=4,REDO=5;
const KINDS=[["lecture","🔷 المحاضرات"],["bank","🔶 البنوك"]];
const app=document.getElementById("app");
let sb,me=null,prof=null,subjects=[],cur=null,tt;

function el(tag,props,kids){
  const e=document.createElement(tag);
  Object.assign(e,props||{});
  (kids||[]).forEach(k=>{if(k)e.appendChild(typeof k==="string"?document.createTextNode(k):k)});
  return e;
}
function toast(t){
  const x=document.getElementById("toast");
  x.textContent=t;x.classList.add("on");
  clearTimeout(tt);tt=setTimeout(()=>x.classList.remove("on"),2400);
}
function mount(node){
  app.textContent="";
  const mark=el("span",{className:"mark"},[el("i"),el("i"),el("i"),el("i")]);
  const bar=el("div",{className:"bar"},[el("span",{className:"brand"},[mark,"Blue Bits"])]);
  if(me)bar.appendChild(el("span",{className:"who"},[((prof&&prof.name)||me.email)+" · ",el("button",{className:"link",textContent:"خروج",onclick:logout})]));
  app.appendChild(bar);
  app.appendChild(node);
  window.scrollTo(0,0);
}

async function init(){
  if(typeof supabase==="undefined"){app.textContent="تعذّر تحميل مكتبة Supabase. تأكد من الإنترنت وحدّث الصفحة.";return}
  sb=supabase.createClient(SB_URL,SB_KEY);
  const {data}=await sb.auth.getSession();
  if(data.session){me=data.session.user;await afterLogin()}else showLogin();
}
async function afterLogin(){
  const {data}=await sb.from("profiles").select("name,role").eq("id",me.id).maybeSingle();
  prof=data||{name:me.email,role:"lead"};
  await loadSubjects();
  showList();
}
async function loadSubjects(){
  const {data,error}=await sb.from("subjects").select("id,name,lead_id,items(id,kind,name,stage,note)").order("name");
  if(error){toast("تعذّر تحميل المواد: "+error.message);subjects=[];return}
  subjects=data||[];
  if(cur)cur=subjects.find(s=>s.id===cur.id)||null;
}
async function logout(){
  await sb.auth.signOut();
  me=null;prof=null;subjects=[];cur=null;showLogin();
}

function showLogin(){
  const em=el("input",{type:"email",placeholder:"الإيميل",autocomplete:"username"});
  const pw=el("input",{type:"password",placeholder:"كلمة السر",autocomplete:"current-password"});
  const msg=el("p",{className:"msg"});
  const f=el("form",{className:"login"},[
    el("h1",{textContent:"أهلاً فيك"}),
    el("p",{className:"hint",textContent:"سجّل دخول لتتابع مرحلة كل ملف بمادتك."}),
    em,pw,el("button",{className:"btn primary",type:"submit",textContent:"دخول"}),msg
  ]);
  f.onsubmit=async e=>{
    e.preventDefault();msg.textContent="جاري الدخول…";
    const {data,error}=await sb.auth.signInWithPassword({email:em.value.trim(),password:pw.value});
    if(error){msg.textContent="الإيميل أو كلمة السر غلط.";return}
    me=data.user;await afterLogin();
  };
  mount(f);
}

function showList(){
  cur=null;
  const all=subjects.flatMap(s=>s.items);
  const pub=all.filter(i=>i.stage===PUB).length,redo=all.filter(i=>i.stage===REDO).length;
  const stat=(n,l,c)=>el("div",{className:"stat "+(c||"")},[el("b",{textContent:n}),el("span",{textContent:l})]);
  const wrap=el("div",{},[
    el("h1",{textContent:"المواد"}),
    el("div",{className:"stats"},[stat(all.length,"ملف"),stat(pub,"منشور","ok"),stat(redo,"للتعديل","warn")])
  ]);
  if(!subjects.length)wrap.appendChild(el("p",{className:"hint",textContent:"ما في مواد ظاهرة لحسابك لسا. اطلب من الأدمن يربط مادة بحسابك."}));
  subjects.forEach(s=>{
    const its=s.items.slice().sort((a,b)=>a.id-b.id);
    const p=its.filter(i=>i.stage===PUB).length;
    wrap.appendChild(el("button",{className:"panel subj",onclick:()=>showDetail(s)},[
      el("div",{className:"top"},[el("h2",{textContent:s.name}),s.lead_id===me.id?el("span",{className:"badge",textContent:"مادتك"}):null]),
      el("div",{className:"cells"},its.map(i=>el("span",{className:"cell s"+i.stage,title:i.name}))),
      el("div",{className:"cap",textContent:its.length?(p+" من "+its.length+" منشورة"):"ما في ملفات لسا"})
    ]));
  });
  mount(wrap);
}

async function save(it,patch){
  const {error}=await sb.from("items").update({...patch,updated_at:new Date().toISOString()}).eq("id",it.id);
  if(error){toast("تعذّر الحفظ: "+error.message);return false}
  Object.assign(it,patch);toast("تم الحفظ ✓");return true;
}

function itemCard(it,edit){
  const label=el("div",{className:"stlabel"});
  const steps=el("div",{className:"steps"});
  function paint(){
    const st=STAGES[it.stage]||STAGES[0];
    label.textContent=st[0]+" "+st[1];
    steps.textContent="";
    for(let i=0;i<=PUB;i++){
      const on=it.stage===REDO?false:i<=it.stage;
      const seg=el("button",{className:"seg"+(on?" on":""),title:STAGES[i][1],disabled:!edit,
        onclick:async()=>{if(await save(it,{stage:i}))paint()}});
      seg.style.setProperty("--c","var(--c"+Math.min(i,PUB)+")");
      steps.appendChild(seg);
    }
    if(it.stage===REDO)label.style.color="var(--c5)";else label.style.color="";
  }
  paint();
  const head=el("div",{className:"head"});
  if(edit){
    const nm=el("input",{className:"nm",value:it.name});
    nm.onchange=()=>save(it,{name:nm.value.trim()||it.name});
    head.appendChild(nm);
    head.appendChild(el("button",{className:"x",textContent:"✕",title:"حذف",onclick:async()=>{
      if(!confirm("حذف «"+it.name+"»؟"))return;
      const {error}=await sb.from("items").delete().eq("id",it.id);
      if(error){toast("تعذّر الحذف");return}
      cur.items=cur.items.filter(x=>x.id!==it.id);showDetail(cur);
    }}));
  }else head.appendChild(el("strong",{textContent:it.name}));
  const card=el("div",{className:"item"},[head,steps,label]);
  if(edit){
    card.appendChild(el("button",{className:"redo",textContent:"↩ رجّعوها للتعديل",onclick:async()=>{if(await save(it,{stage:REDO}))paint()}}));
    const note=el("input",{className:"note",placeholder:"ملاحظة (اختياري)",value:it.note||""});
    note.onchange=()=>save(it,{note:note.value.trim()});
    card.appendChild(note);
  }else if(it.note)card.appendChild(el("div",{className:"cap",textContent:it.note}));
  return card;
}

function reportText(){
  const head=[
    "📋 تقرير متابعة: "+cur.name,
    "👤 مسؤول المادة: "+((prof&&prof.name)||me.email),
    "📅 "+new Date().toLocaleDateString("en-GB")
  ].join("\n");
  const secs=KINDS.map(([k,t])=>{
    const its=cur.items.filter(i=>i.kind===k).sort((a,b)=>a.id-b.id);
    if(!its.length)return "";
    return t+"\n"+its.map(i=>"• "+i.name+" ← "+STAGES[i.stage][0]+" "+STAGES[i.stage][1]+(i.note&&i.note.trim()?" ("+i.note.trim()+")":"")).join("\n");
  }).filter(Boolean).join("\n\n");
  return head+(secs?"\n\n"+secs:"");
}

function showDetail(s){
  cur=s;
  const edit=s.lead_id===me.id;
  const wrap=el("div",{},[
    el("button",{className:"link",textContent:"→ كل المواد",onclick:async()=>{await loadSubjects();showList()}}),
    el("h1",{textContent:s.name})
  ]);
  wrap.appendChild(el("p",{className:"hint",textContent:edit?"اضغط على المرحلة لتحديد وين وصل الملف.":"عرض فقط. التعديل لمسؤول المادة."}));
  KINDS.forEach(([kind,title])=>{
    wrap.appendChild(el("div",{className:"kind"},[el("h2",{textContent:title})]));
    const its=s.items.filter(i=>i.kind===kind).sort((a,b)=>a.id-b.id);
    if(!its.length)wrap.appendChild(el("p",{className:"hint",textContent:"ما في ملفات لسا."}));
    its.forEach(it=>wrap.appendChild(itemCard(it,edit)));
    if(edit){
      const nm=el("input",{placeholder:kind==="lecture"?"اسم المحاضرة (مثال: محاضرة 3)":"اسم البنك (مثال: بنك 2)"});
      const add=el("button",{className:"btn link",textContent:"+ إضافة",onclick:async()=>{
        const v=nm.value.trim();
        if(!v){toast(kind==="lecture"?"اكتب اسم المحاضرة أولاً":"اكتب اسم البنك أولاً");nm.focus();return}
        const {data,error}=await sb.from("items").insert({subject_id:s.id,kind,name:v}).select("id,kind,name,stage,note").single();
        if(error){toast("تعذّرت الإضافة: "+error.message);return}
        s.items.push(data);showDetail(s);
      }});
      wrap.appendChild(el("div",{className:"addrow"},[nm,add]));
    }
  });
  if(edit){
    wrap.appendChild(el("div",{className:"acts"},[
      el("button",{className:"btn primary",textContent:"إرسال التقرير عبر تيليجرام",onclick:()=>{
        window.open("https://t.me/share/url?url=&text="+encodeURIComponent(reportText()),"_blank");
      }}),
      el("button",{className:"btn",textContent:"نسخ التقرير",onclick:async()=>{
        try{await navigator.clipboard.writeText(reportText());toast("تم النسخ ✓")}
        catch(e){toast("تعذّر النسخ")}
      }})
    ]));
  }
  mount(wrap);
}

init();
</script>
</body>
</html>
